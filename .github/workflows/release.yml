name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Kotlin CLI executable
        run: chmod +x ./kotlin

      - name: Build project
        run: ./kotlin build

      - name: Run tests
        run: ./kotlin test

      - name: Package server executable JAR
        run: ./kotlin package -m server -f executable-jar

      - name: Package web app
        run: |
          WEB_APP_DIR="build/tasks/_webApp_buildWasmJsAppWasmJsDebug"
          mkdir -p dist/web
          # Copy core deployable files
          cp "$WEB_APP_DIR/index.html" dist/web/
          cp "$WEB_APP_DIR/webApp.wasm" dist/web/
          cp "$WEB_APP_DIR/webApp.mjs" dist/web/
          cp "$WEB_APP_DIR/webApp.js-builtins.mjs" dist/web/
          cp "$WEB_APP_DIR/webApp.import-object.mjs" dist/web/
          cp "$WEB_APP_DIR/skiko.mjs" dist/web/
          cp "$WEB_APP_DIR/skiko.wasm" dist/web/
          cp "$WEB_APP_DIR/styles.css" dist/web/
          cp "$WEB_APP_DIR/import-map-loader.js" dist/web/
          # Copy vendors directory (required by import-map-loader.js at runtime)
          cp -r "$WEB_APP_DIR/vendors" dist/web/
          cd dist && zip -r ../web-app.zip web/ && cd ..

      - name: Get tag version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            build/tasks/_server_executableJarJvm/server-jvm-executable.jar
            web-app.zip
