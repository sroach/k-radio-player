name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Kotlin CLI executable
        run: chmod +x ./kotlin

      - name: Build project
        run: ./kotlin build

      - name: Run tests
        run: ./kotlin test
